            }
            
            if (gamePhase === 'thirdPaused') {
                thirdVideo.stop();
                thirdVideo.hide();
                gamePhase = 'journal';
                journalStartTime = millis();
                return false;
            }
            
            if (gamePhase === 'journal') {
                if (millis() - journalStartTime > 5000) {
                    completeReset();
                }
                return false;
            }
            
            if (showMissionDialog) {
                showMissionDialog = false;
                showOperationGuide = true;
                return false;
            }
            
            if (showOperationGuide) {
                showOperationGuide = false;
                gamePhase = 'playing';
                missionStartTime = millis();
                return false;
            }
            
            touchStartCount = touches.length;
            touchStartTimer = millis();
            
            if (touches.length === 1) {
                leftMousePressed = true;
                rightMousePressed = false;
            } else if (touches.length >= 2) {
                leftMousePressed = false;
                rightMousePressed = true;
            }
            
            if (isPaused && touches.length === 1) {
                touchLongPressStartTime = millis();
                return false;
            }
            
            if (restartConfirm) {
                if (touches.length === 1) {
                    resetGame();
                } else if (touches.length >= 2) {
                    restartConfirm = false;
                    manualPaused = false;
                    lastMoveTime = millis();
                }
                return false;
            }
            
            if (showHelp) {
                showHelp = false;
                manualPaused = false;
                lastMoveTime = millis();
                if (restartButtonHovered) {
                    restartConfirm = true;
                }
                return false;
            }
            
            if (restartButtonHovered) {
                restartConfirm = true;
                manualPaused = true;
                return false;
            }
            
            if (pauseButtonHovered) {
                manualPaused = !manualPaused;
                if (!manualPaused) {
                    lastMoveTime = millis();
                }
                return false;
            }
            
            if (helpButtonHovered) {
                showHelp = true;
                manualPaused = true;
                return false;
            }
            
            if (moveMode === 'key') {
                if (touches.length === 1) {
                    nextDir = 'left';
                } else if (touches.length >= 2) {
                    nextDir = 'right';
                }
            }
            
            if (gameOver && touches.length >= 1) {
                player = new PlayerDrop(CANVAS_CENTER_X, 150, PLAYER_INITIAL_RADIUS);
                createDrops();
                createAIDrops();
                lastMoveTime = millis();
                swallowCount = 0;
                starCount = 0;
                dustEffectEndTime = 0;
                gameOver = false;
                missionComplete = false;
                missionCompleteTime = 0;
                missionFailed = false;
                missionFailedTime = 0;
                missionTimeRemaining = MISSION_TIME_LIMIT;
                nextDir = null;
                particles = [];
                ripples = [];
                trails = [];
                fusedAIs = [];
                activePartners = 0;
                playerMoveInterval = MOVE_INTERVAL;
                moveMode = 'key';
                noTargetCount = 0;
                showMissionDialog = true;
                showOperationGuide = false;
                missionPausedTime = 0;
                missionPausedStartTime = 0;
                missionCompleteSoundPlayed = false;
                hasSeenDustWarning = false;
                return false;
            }
            
            if (showMissionDialog) {
                showMissionDialog = false;
                showOperationGuide = true;
                return false;
            }
            
            if (showOperationGuide) {
                showOperationGuide = false;
                gamePhase = 'playing';
                missionStartTime = millis();
                return false;
            }
            
            if (missionComplete && touches.length >= 1) {
                if (bgMusicLoaded && bgMusic) {
                    try {
                        bgMusic.stop();
                    } catch (e) {
                        console.log('Background music stop failed');
                    }
                }
                
                if (thirdVideoLoaded && thirdVideo) {
                    thirdVideo.elt.muted = false;
                    thirdVideo.play();
                    gamePhase = 'thirdVideo';
                } else {
                    gamePhase = 'journal';
                    journalStartTime = millis();
                    
                    if (bgMusicLoaded && bgMusic) {
                        try {
                            bgMusic.setVolume(0.35);
                            bgMusic.loop();
                        } catch (e) {
                            console.log('Background music play failed');
                        }
                    }
                }
                
                player = new PlayerDrop(CANVAS_CENTER_X, 150, PLAYER_INITIAL_RADIUS);
                createDrops();
                createAIDrops();
                lastMoveTime = millis();
                swallowCount = 0;
                starCount = 0;
                dustEffectEndTime = 0;
                gameOver = false;
                missionComplete = false;
                missionCompleteTime = 0;
                missionFailed = false;
                missionFailedTime = 0;
                missionTimeRemaining = MISSION_TIME_LIMIT;
                nextDir = null;
                particles = [];
                ripples = [];
                trails = [];
                fusedAIs = [];
                activePartners = 0;
                playerMoveInterval = MOVE_INTERVAL;
                moveMode = 'key';
                noTargetCount = 0;
                showMissionDialog = false;
                showOperationGuide = false;
                missionPausedTime = 0;
                missionPausedStartTime = 0;
                return false;
            }
            
            if (missionFailed && touches.length >= 1) {
                if (bgMusicLoaded && bgMusic) {
                    try {
                        bgMusic.stop();
                    } catch (e) {
                        console.log('Background music stop failed');
                    }
                }
                
                if (thirdVideoLoaded && thirdVideo) {
                    thirdVideo.elt.muted = false;
                    thirdVideo.play();
                    gamePhase = 'thirdVideo';
                } else {
                    gamePhase = 'journal';
                    journalStartTime = millis();
                    
                    if (bgMusicLoaded && bgMusic) {
                        try {
                            bgMusic.setVolume(0.35);
                            bgMusic.loop();
                        } catch (e) {
                            console.log('Background music play failed');
                        }
                    }
                }
                
                player = new PlayerDrop(CANVAS_CENTER_X, 150, PLAYER_INITIAL_RADIUS);
                createDrops();
                createAIDrops();
                lastMoveTime = millis();
                swallowCount = 0;
                starCount = 0;
                dustEffectEndTime = 0;
                gameOver = false;
                missionComplete = false;
                missionCompleteTime = 0;
                missionFailed = false;
                missionFailedTime = 0;
                missionTimeRemaining = MISSION_TIME_LIMIT;
                nextDir = null;
                particles = [];
                ripples = [];
                trails = [];
                fusedAIs = [];
                playerMoveInterval = MOVE_INTERVAL;
                moveMode = 'key';
                noTargetCount = 0;
                showMissionDialog = true;
                missionPausedTime = 0;
                missionPausedStartTime = 0;
                return false;
            }
            
            return false;
        }
        
        function touchEnded() {
            leftMousePressed = false;
            rightMousePressed = false;
            
            if (touchLongPressStartTime > 0) {
                const pressDuration = millis() - touchLongPressStartTime;
                if (pressDuration >= LONG_PRESS_THRESHOLD && isPaused) {
                    endMeeting(true);
                }
                touchLongPressStartTime = 0;
            }
            return false;
        }
    </script>
</body>
