    <script>

        const INITIAL_DROPS_COUNT = 110;

        const PLAYER_MAX_RADIUS = 35;
        const PLAYER_RADIUS_INCREMENT = 0.3;

        const TRAIL_FADE_TIME = 300;
        
        const AI_COUNT_MIN = 5;
        const AI_COUNT_MAX = 8;
        const AI_INITIAL_RADIUS_MIN = 10;
        const AI_INITIAL_RADIUS_MAX = 14;
        const AI_MAX_RADIUS = 16;

        const MEETING_DISTANCE_MULTIPLIER = 1.5;

        const LONG_PRESS_THRESHOLD = 300;

        const AI_NAMES = ['雨落', '云影', '清露', '雾岚', '霜华', '雪绒', '风絮', '星点'];

        let nextDir = null;

        let moveTargetPos;

        let swallowCount = 0;
        let starCount = 0;
        let gameOver = false;
        let gameOverTime = 0;

        let dustEffectEndTime = 0;
        
        const STAR_GOAL = 10;
        let missionComplete = false;
        let missionCompleteTime = 0;
        
        const MISSION_TIME_LIMIT = 120000;
        let showMissionDialog = true;
        let missionStartTime = 0;
        let tutorialTriggered = false; // 防止教程重复触发的锁
        let missionTimeRemaining = MISSION_TIME_LIMIT;
        let missionFailed = false;
        let missionFailedTime = 0;
        
        const FUSION_DURATION = 15000;

        const DUST_EFFECT_DURATION = 4000;
        const DUST_INTERVAL_INCREASE = 500;

        let manualPaused = false;

        const greetingMessages = [

        ];

        const rainbowColors = [

        ];

        let showStartDialog = false;

        let mergeSound;

        let missionCompleteSound;
        let missionCompleteSoundLoaded = false;
        let missionCompleteSoundPlayed = false;
        
        let bgMusic;
        let bgMusicLoaded = false;
        
        let mouseTrail = [];
        let mouseParticles = [];
        let lastMouseX = 0;
        let lastMouseY = 0;
        let isMouseMoved = false;
        let mouseFrameCount = 0;
        
        class PlayerDrop {
            constructor(worldX, worldY, radius) {
                this.worldX = worldX;
                this.worldY = worldY;
                this.radius = radius;
                this.targetRadius = radius;
                this.radiusChangeStartTime = 0;
                this.radiusChangeStartValue = radius;
                this.isRadiusChanging = false;
            }
            
            get screenX() {
                return CANVAS_CENTER_X;
            }
            
            get screenY() {
                return CANVAS_CENTER_Y;
            }
            
            setRadius(newRadius) {
                this.targetRadius = constrain(newRadius, PLAYER_INITIAL_RADIUS, PLAYER_MAX_RADIUS);
                this.radiusChangeStartValue = this.radius;
                this.radiusChangeStartTime = millis();
                this.isRadiusChanging = true;
            }
            
            updateRadius() {
                if (!this.isRadiusChanging) return;
                
                const elapsed = millis() - this.radiusChangeStartTime;
                const duration = 300;
                const progress = constrain(elapsed / duration, 0, 1);
                const eased = easeInOutQuad(progress);
                
                this.radius = lerp(this.radiusChangeStartValue, this.targetRadius, eased);
                
                if (progress >= 1) {
                    this.isRadiusChanging = false;
                    this.radius = this.targetRadius;
                }
            }
            
            display() {
                const displayRadius = this.radius;
                
                if (activePartners >= MAX_FUSIONS) {
                    const glowRadius = displayRadius * 1.3;
                    const pulse = sin(millis() * 0.002) * 0.15 + 1;
                    const glowPulse = glowRadius * pulse;
                    
                    fill(255, 215, 100, 30);
                    noStroke();
                    ellipse(this.screenX, this.screenY, glowPulse * 2.5, glowPulse * 2.5);
                    
                    fill(255, 215, 100, 50);
                    noStroke();
                    ellipse(this.screenX, this.screenY, glowPulse * 2, glowPulse * 2);
                    
                    fill(255, 230, 150, 30);
                    noStroke();
                    ellipse(this.screenX, this.screenY, glowPulse * 1.5, glowPulse * 1.5);
                }
                
                fill(255, 215, 100, 220);
                stroke(255, 230, 150, 200);
                strokeWeight(1);
                ellipse(this.screenX, this.screenY, displayRadius * 2, displayRadius * 2);
                
                const highlightAlpha = activePartners >= MAX_FUSIONS ? 195 : 150;
                fill(255, 255, 255, highlightAlpha);
                ellipse(this.screenX - displayRadius * 0.3, this.screenY - displayRadius * 0.3, 
                        displayRadius * 0.4, displayRadius * 0.4);
                
                if (activePartners >= MAX_FUSIONS) {
                    fill(255, 255, 255, 220);
                    ellipse(this.screenX - displayRadius * 0.25, this.screenY - displayRadius * 0.25, 
                            displayRadius * 0.35, displayRadius * 0.35);
                }
            }
            
            moveTo(targetWorldX, targetWorldY) {
                moveStartPos = { worldX: this.worldX, worldY: this.worldY };
                moveTargetPos = { worldX: targetWorldX, worldY: targetWorldY };
                moveStartTime = millis();
                isMoving = true;
            }
            
            updateMovement() {
                if (!isMoving) return;
                
                const elapsed = millis() - moveStartTime;
                const progress = constrain(elapsed / MOVE_DURATION, 0, 1);
                const eased = easeInOutQuad(progress);
                
                this.worldX = lerp(moveStartPos.worldX, moveTargetPos.worldX, eased);
                this.worldY = lerp(moveStartPos.worldY, moveTargetPos.worldY, eased);
                
                if (!isPaused && !manualPaused && millis() - lastTrailTime > 50) {
                    trails.push({
                        worldX: this.worldX,
                        worldY: this.worldY,
                        startTime: millis(),
                        radius: this.radius
                    });
                    lastTrailTime = millis();
                }
                
                if (progress >= 1) {
                    isMoving = false;
                }
            }
            
            increaseRadius() {
                // 吞噬普通小水珠时体积没有变化
            }
            
            displayHighlighted() {
                fill(255, 215, 100, 220);
                stroke(255, 255, 255, 150);
                strokeWeight(2);
                ellipse(this.screenX, this.screenY, this.radius * 2 + 4, this.radius * 2 + 4);
                
                fill(255, 215, 100, 220);
                stroke(255, 230, 150, 200);
                strokeWeight(1);
                ellipse(this.screenX, this.screenY, this.radius * 2, this.radius * 2);
                
                fill(255, 255, 255, 150);
                ellipse(this.screenX - this.radius * 0.3, this.screenY - this.radius * 0.3, 
                        this.radius * 0.4, this.radius * 0.4);
            }
            
            distanceTo(other) {
                return dist(this.worldX, this.worldY, other.worldX, other.worldY);
            }
        }
        
        let aiIdCounter = 0;
        
        class AIDrop {
            constructor(worldX, worldY, radius) {
                this.worldX = worldX;
                this.worldY = worldY;
                this.radius = radius;
                this.isMoving = false;
                this.moveStartPos = null;
                this.moveTargetPos = null;
                this.moveStartTime = 0;
                this.lastMoveTime = millis() + random(AI_MOVE_OFFSET);
                this.moveInterval = random(400, 1000);
                this.name = AI_NAMES[floor(random(AI_NAMES.length))];
                this.id = aiIdCounter++;
                this.hasFusedWithPlayer = false;
                this.stuckTime = 0;
            }
            
            getScreenPos() {
                const offsetX = player.worldX - CANVAS_CENTER_X;
                const offsetY = player.worldY - CANVAS_CENTER_Y;
                return {
                    x: this.worldX - offsetX,
                    y: this.worldY - offsetY
                };
            }
            
            isOnScreen() {
                const pos = this.getScreenPos();
                return pos.x > -100 && pos.x < CANVAS_WIDTH + 100 &&
                       pos.y > -100 && pos.y < CANVAS_HEIGHT + 100;
            }
            
            display() {
                const pos = this.getScreenPos();
                
                fill(180, 220, 230, 200);
                stroke(200, 240, 255, 180);
                strokeWeight(1);
                ellipse(pos.x, pos.y, this.radius * 2, this.radius * 2);
                
                fill(255, 255, 255, 150);
                ellipse(pos.x - this.radius * 0.3, pos.y - this.radius * 0.3, 
                        this.radius * 0.4, this.radius * 0.4);
                
                fill(200, 230, 240, 100);
                ellipse(pos.x + this.radius * 0.2, pos.y + this.radius * 0.2, 
                        this.radius * 0.25, this.radius * 0.25);
                
                const elapsed = millis() - this.lastMoveTime;
                const progress = (elapsed / MOVE_INTERVAL) % 1;
                const pulseAlpha = 30 + sin(progress * TWO_PI) * 20;
                stroke(200, 240, 255, pulseAlpha);
                strokeWeight(0.5);
                noFill();
                ellipse(pos.x, pos.y, (this.radius + 2) * 2, (this.radius + 2) * 2);
            }
            
            displayHighlighted() {
                const pos = this.getScreenPos();
                
                fill(180, 220, 230, 200);
                stroke(255, 255, 255, 150);
                strokeWeight(2);
                ellipse(pos.x, pos.y, this.radius * 2 + 4, this.radius * 2 + 4);
                
                fill(180, 220, 230, 200);
                stroke(200, 240, 255, 180);
                strokeWeight(1);
                ellipse(pos.x, pos.y, this.radius * 2, this.radius * 2);
                
                fill(255, 255, 255, 150);
                ellipse(pos.x - this.radius * 0.3, pos.y - this.radius * 0.3, 
                        this.radius * 0.4, this.radius * 0.4);
                
                fill(200, 230, 240, 100);
                ellipse(pos.x + this.radius * 0.2, pos.y + this.radius * 0.2, 
                        this.radius * 0.25, this.radius * 0.25);
            }
            
            moveTo(targetWorldX, targetWorldY) {
                this.moveStartPos = { worldX: this.worldX, worldY: this.worldY };
                this.moveTargetPos = { worldX: targetWorldX, worldY: targetWorldY };
                this.moveStartTime = millis();
                this.isMoving = true;
            }
            
            updateMovement() {
                if (!this.isMoving) return;
                
                const elapsed = millis() - this.moveStartTime;
                const progress = constrain(elapsed / MOVE_DURATION, 0, 1);
                const eased = easeInOutQuad(progress);
                
                this.worldX = lerp(this.moveStartPos.worldX, this.moveTargetPos.worldX, eased);
                this.worldY = lerp(this.moveStartPos.worldY, this.moveTargetPos.worldY, eased);
                
                if (progress >= 1) {
                    this.isMoving = false;
                }
            }
            
            increaseRadius() {
                this.radius = min(this.radius + AI_RADIUS_INCREMENT, AI_MAX_RADIUS);
            }
            
            findTargetDrop() {
                const candidates = drops.filter(d => 
                    d.worldX <= this.worldX && d.worldY >= this.worldY
                );
                
                if (candidates.length === 0) {
                    return null;
                }
                
                let nearest = candidates[0];
                let minDist = dist(this.worldX, this.worldY, nearest.worldX, nearest.worldY);
                
                for (let d of candidates) {
                    const dDist = dist(this.worldX, this.worldY, d.worldX, d.worldY);
                    if (dDist < minDist) {
                        minDist = dDist;
                        nearest = d;
                    }
                }
                
                return nearest;
            }
            
            performMove() {
                const target = this.findTargetDrop();
                
                if (!target) {
                    this.stuckTime += this.moveInterval;
                    return;
                }
                
                this.stuckTime = 0;
                
                const targetScreenPos = target.getScreenPos();
                ripples.push(new Ripple(targetScreenPos.x, targetScreenPos.y));
                
                for (let i = 0; i < random(3, 6); i++) {
                    const angle = random(TWO_PI);
                    const speed = random(2, 5);
                    particles.push(new Particle(targetScreenPos.x, targetScreenPos.y, angle, speed));
                }
                
                this.moveTo(target.worldX, target.worldY);
                this.increaseRadius();
                
                const idx = drops.indexOf(target);
                if (idx > -1) {
                    drops.splice(idx, 1);
                }
                
                this.lastMoveTime = millis();
                this.moveInterval = random(400, 1000);
            }
            
            update() {
                this.updateMovement();
                
                const currentTime = millis();
                if (currentTime - this.lastMoveTime >= this.moveInterval && !this.isMoving) {
                    this.performMove();
                }
            }
        }
        
        class NormalDrop {
            constructor(worldX, worldY, radius, hasStar = false, hasDust = false) {
                this.worldX = worldX;
                this.worldY = worldY;
                this.radius = radius;
                this.opacity = 200;
                this.hasStar = hasStar;
                this.hasDust = hasDust;
                this.starColor = hasStar ? [random(255), random(255), random(200, 255)] : null;
            }
            
            getScreenPos() {
                const offsetX = player.worldX - CANVAS_CENTER_X;
                const offsetY = player.worldY - CANVAS_CENTER_Y;
                return {
                    x: this.worldX - offsetX,
                    y: this.worldY - offsetY
                };
            }
            
            isOnScreen() {
                const pos = this.getScreenPos();
                return pos.x > -50 && pos.x < CANVAS_WIDTH + 50 &&
                       pos.y > -50 && pos.y < CANVAS_HEIGHT + 50;
            }
            
            display() {
                const pos = this.getScreenPos();
                
                if (this.hasStar) {
                    this.drawStar(pos.x, pos.y, 5, this.radius * 1.5, this.radius * 0.6);
                    return;
                }
                
                if (this.hasDust) {
                    fill(100, 90, 80, this.opacity);
                    stroke(120, 110, 100, 180);
                } else {
                    fill(180, 220, 255, this.opacity);
                    stroke(200, 230, 255, 180);
                }
                strokeWeight(0.5);
                ellipse(pos.x, pos.y, this.radius * 2, this.radius * 2);
                
                fill(255, 255, 255, 100);
                ellipse(pos.x - this.radius * 0.25, pos.y - this.radius * 0.25, 
                        this.radius * 0.3, this.radius * 0.3);
                
                if (this.hasDust) {
                    fill(160, 140, 120, 180);
                    textSize(this.radius * 0.7);
                    textAlign(CENTER, CENTER);
                    text('*', pos.x, pos.y + 1);
                }
            }
            
            drawStar(x, y, numPoints, outerRadius, innerRadius) {
                const [r, g, b] = this.starColor || [255, 255, 200];
                
                const pulse = sin(millis() * 0.003) * 0.3 + 0.7;
                const glowAlpha = 30 + pulse * 25;
                
                const glowRadius1 = outerRadius * 4 * pulse;
                fill(r, g, b, glowAlpha);
                noStroke();
                ellipse(x, y, glowRadius1, glowRadius1);
                
                const glowRadius2 = outerRadius * 3 * pulse;
                fill(r, g, b + 30, glowAlpha * 0.9);
                ellipse(x, y, glowRadius2, glowRadius2);
                
                const glowRadius3 = outerRadius * 2.2 * pulse;
                fill(r + 20, g + 20, b + 50, glowAlpha * 0.7);
                ellipse(x, y, glowRadius3, glowRadius3);
                
                const glowRadius4 = outerRadius * 1.5 * pulse;
                fill(r + 40, g + 40, b + 60, glowAlpha * 0.5);
                ellipse(x, y, glowRadius4, glowRadius4);
                
                fill(r, g, b, 220);
                stroke(r + 20, g + 20, b + 20, 180);
                strokeWeight(0.5);
                
                beginShape();
                for (let i = 0; i < numPoints * 2; i++) {
                    const angle = TWO_PI * i / (numPoints * 2) - HALF_PI;
                    const radius = i % 2 === 0 ? outerRadius : innerRadius;
                    const px = x + cos(angle) * radius;
                    const py = y + sin(angle) * radius;
                    vertex(px, py);
                }
                endShape(CLOSE);
                
                const highlightSize = outerRadius * 0.3 * (0.8 + pulse * 0.4);
                fill(255, 255, 255, 150 + pulse * 50);
                ellipse(x - outerRadius * 0.2, y - outerRadius * 0.2, highlightSize, highlightSize);
                
                fill(255, 255, 255, 120 + pulse * 40);
                ellipse(x - outerRadius * 0.15, y - outerRadius * 0.15, highlightSize * 0.7, highlightSize * 0.7);
            }
            
            distanceTo(other) {
                if (other instanceof PlayerDrop) {
                    return dist(this.worldX, this.worldY, other.worldX, other.worldY);
                }
                return dist(this.worldX, this.worldY, other.worldX, other.worldY);
            }
        }
        
        class Particle {
            constructor(x, y, angle, speed, isAwakened = false) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.speed = speed;
                this.life = 1;
                this.size = random(1, 4);
                this.isAwakened = isAwakened;
            }
            
            update() {
                this.x += cos(this.angle) * this.speed;
                this.y += sin(this.angle) * this.speed;
                this.life -= this.isAwakened ? 0.025 : 0.03;
            }
            
            display() {
                if (this.life <= 0) return;
                
                if (this.isAwakened) {
                    fill(255, 215, 100, this.life * 200);
                } else {
                    fill(255, 255, 255, this.life * 150);
                }
                noStroke();
                ellipse(this.x, this.y, this.size, this.size);
            }
        }
        
        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = 30;
                this.life = 1;
            }
            
            update() {
                this.radius += 1.5;
                this.life -= 0.05;
            }
            
            display() {
                if (this.life <= 0) return;
                stroke(200, 230, 255, this.life * 100);
                strokeWeight(1);
                noFill();
                ellipse(this.x, this.y, this.radius * 2, this.radius * 2);
            }
        }
        
        function easeInOutQuad(t) {
            return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        }
        
        function createDrops() {
            drops = [];
            const worldCenterX = CANVAS_CENTER_X;
            const worldCenterY = CANVAS_CENTER_Y;
            const gridSize = 40;
            const minDropDistance = 28;
            const viewWidth = CANVAS_WIDTH + 600;
            const viewHeight = CANVAS_HEIGHT + 600;
            const cols = Math.ceil(viewWidth / gridSize);
            const rows = Math.ceil(viewHeight / gridSize);
            const startCol = Math.floor((worldCenterX - viewWidth / 2) / gridSize);
            const startRow = Math.floor((worldCenterY - viewHeight / 2) / gridSize);
            
            const avoidRadius = Math.ceil(60 / gridSize);
            const avoidCenterCol = Math.floor(worldCenterX / gridSize);
            const avoidCenterRow = Math.floor(150 / gridSize);
            
            const gridCells = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const worldR = startRow + r;
                    const worldC = startCol + c;
                    const distToAvoid = dist(worldC, worldR, avoidCenterCol, avoidCenterRow);
                    if (distToAvoid > avoidRadius) {
                        gridCells.push({ r: worldR, c: worldC });
                    }
                }
            }
            
            const targetDrops = INITIAL_DROPS_COUNT;
            const step = Math.max(1, Math.floor(gridCells.length / targetDrops));
            
            for (let i = 0; i < gridCells.length && drops.length < targetDrops; i += step) {
                const cell = gridCells[i];
                const worldX = cell.c * gridSize + gridSize / 2 + random(-gridSize / 5, gridSize / 5);
                const worldY = cell.r * gridSize + gridSize / 2 + random(-gridSize / 5, gridSize / 5);
                const radius = random(MIN_DROP_RADIUS, MAX_DROP_RADIUS);
                
                let valid = true;
                for (const d of drops) {
                    if (dist(worldX, worldY, d.worldX, d.worldY) < minDropDistance) {
                        valid = false;
                        break;
                    }
                }
                
                if (valid) {
                    const hasStar = random() < 0.1;
                    const hasDust = !hasStar && random() < 0.06;
                    drops.push(new NormalDrop(worldX, worldY, radius, hasStar, hasDust));
                }
            }
            
            let attempt = 0;
            const maxAttempts = 500;
            while (drops.length < targetDrops && attempt < maxAttempts) {
                attempt++;
                const randomCell = gridCells[floor(random(gridCells.length))];
                const worldX = randomCell.c * gridSize + gridSize / 2 + random(-gridSize / 4, gridSize / 4);
                const worldY = randomCell.r * gridSize + gridSize / 2 + random(-gridSize / 4, gridSize / 4);
                const radius = random(MIN_DROP_RADIUS, MAX_DROP_RADIUS);
                
                let valid = true;
                for (const d of drops) {
                    if (dist(worldX, worldY, d.worldX, d.worldY) < minDropDistance) {
                        valid = false;
                        break;
                    }
                }
                
                if (valid) {
                    const hasStar = random() < 0.1;
                    const hasDust = !hasStar && random() < 0.06;
                    drops.push(new NormalDrop(worldX, worldY, radius, hasStar, hasDust));
                }
            }
        }
        
        function spawnNewDrop() {
            const angle = random(TWO_PI);
            const dist = random(200, 350);
            const worldX = player.worldX + cos(angle) * dist;
            const worldY = player.worldY + sin(angle) * dist;
            const radius = random(MIN_DROP_RADIUS, MAX_DROP_RADIUS);
            const hasStar = random() < 0.08;
            const hasDust = !hasStar && random() < 0.05;
            drops.push(new NormalDrop(worldX, worldY, radius, hasStar, hasDust));
        }
        
        function spawnAIDrop() {
            const offsetX = player.worldX - CANVAS_CENTER_X;
            const offsetY = player.worldY - CANVAS_CENTER_Y;
            
            let worldX, worldY;
            if (random() > 0.5) {
                worldX = CANVAS_WIDTH + 50 + offsetX;
                worldY = random(-50, CANVAS_HEIGHT / 2) + offsetY;
            } else {
                worldX = random(CANVAS_WIDTH / 2, CANVAS_WIDTH + 50) + offsetX;
                worldY = -50 + offsetY;
            }
            
            const radius = random(AI_INITIAL_RADIUS_MIN, AI_INITIAL_RADIUS_MAX);
            return new AIDrop(worldX, worldY, radius);
        }
        
        function createAIDrops() {
            aiDrops = [];
            for (let i = 0; i < AI_COUNT_MIN; i++) {
                aiDrops.push(spawnAIDrop());
            }
        }
        
        function manageAIDrops() {
            const beforeCount = aiDrops.length;
            const STUCK_THRESHOLD = 3000;
            
            for (let i = aiDrops.length - 1; i >= 0; i--) {
                const ai = aiDrops[i];
                
                if (!ai.isOnScreen()) {
                    aiDrops.splice(i, 1);
                    continue;
                }
                
                const pos = ai.getScreenPos();
                const isInBottomLeft = pos.x < CANVAS_WIDTH * 0.3 && pos.y > CANVAS_HEIGHT * 0.7;
                
                if (ai.stuckTime >= STUCK_THRESHOLD || isInBottomLeft) {
                    aiDrops.splice(i, 1);
                    continue;
                }
            }
            
            const removedCount = beforeCount - aiDrops.length;
            
            for (let i = 0; i < removedCount && aiDrops.length < AI_COUNT_MAX; i++) {
                aiDrops.push(spawnAIDrop());
            }
            
            while (aiDrops.length < AI_COUNT_MIN) {
                aiDrops.push(spawnAIDrop());
            }
        }
        
        function checkMeeting() {
            if (isPaused || manualPaused || millis() < cooldownEndTime || aiDrops.length === 0 || fusedAIs.length >= MAX_FUSIONS) {
                return;
            }
            
            let nearestAI = null;
            let minDist = Infinity;
            
            for (const ai of aiDrops) {
                if (ai.hasFusedWithPlayer) {
                    continue;
                }
                
                const dist = player.distanceTo(ai);
                const maxDist = (player.radius + ai.radius) * MEETING_DISTANCE_MULTIPLIER;
                
                if (dist <= maxDist && dist < minDist) {
                    minDist = dist;
                    nearestAI = ai;
                }
            }
            
            if (nearestAI) {
                triggerMeeting(nearestAI);
            }
        }
        
        function triggerMeeting(ai) {
            isPaused = true;
            meetingAI = ai;
            pauseStartTime = millis();
            longPressStartTime = 0;
            
            const randomIndex = floor(random(greetingMessages.length));
            currentGreeting = greetingMessages[randomIndex];
        }
        
        function endMeeting(fuse = false) {
            if (fuse && meetingAI) {
                const aiIdx = aiDrops.indexOf(meetingAI);
                if (aiIdx > -1) {
                    const aiRadius = meetingAI.radius;
                    const newRadius = player.targetRadius + aiRadius * 0.3;
                    player.setRadius(newRadius);
                    
                    const aiScreenPos = meetingAI.getScreenPos();
                    ripples.push(new Ripple(aiScreenPos.x, aiScreenPos.y));
                    
                    for (let i = 0; i < random(5, 8); i++) {
                        const angle = random(TWO_PI);
                        const speed = random(3, 7);
                        particles.push(new Particle(aiScreenPos.x, aiScreenPos.y, angle, speed));
                    }
                    
                    fusionPopup = {
                        name: meetingAI.name,
                        startTime: millis()
                    };
                    
                    fusedAIs.push({
                        originalRadius: aiRadius,
                        endTime: millis() + FUSION_DURATION,
                        name: meetingAI.name,
                        aiId: meetingAI.id,
                        splitWorldX: player.worldX,
                        splitWorldY: player.worldY
                    });
                    
                    if (meetingAI) {
                        totalFriends++;
                        friendNames.push(meetingAI.name);
                        
                        if (mergeSoundLoaded && mergeSound) {
                            try {
                                mergeSound.setVolume(0.6);
                                mergeSound.play();
                            } catch (e) {
                                console.log('Merge sound play failed');
                            }
                        }
                    }
                    
                    const prevActivePartners = activePartners;
                    activePartners = fusedAIs.length;
                    
                    if (activePartners >= MAX_FUSIONS && prevActivePartners < MAX_FUSIONS) {
                        moveMode = 'mouse';
                        
                        for (let i = 0; i < 30; i++) {
                            const angle = random(TWO_PI);
                            const speed = random(2, 6);
                            particles.push(new Particle(CANVAS_CENTER_X, CANVAS_CENTER_Y, angle, speed, true));
                        }
                        
                        ripples.push(new Ripple(CANVAS_CENTER_X, CANVAS_CENTER_Y));
                        ripples.push(new Ripple(CANVAS_CENTER_X, CANVAS_CENTER_Y));
                        
                        awakeningFlashEndTime = millis() + 300;
                    }
                    
                    let interval = MOVE_INTERVAL - fusedAIs.length * FUSION_INTERVAL_REDUCTION;
                    if (activePartners >= MAX_FUSIONS) {
                        interval -= 200;
                    }
                    playerMoveInterval = max(interval, 500);
                    
                    aiDrops.splice(aiIdx, 1);
                    aiDrops.push(spawnAIDrop());
                }
            }
            
            isPaused = false;
            meetingAI = null;
            currentGreeting = '';
            cooldownEndTime = millis() + COOLDOWN_DURATION;
        }
        
        function updateFusions() {
            const currentTime = millis();
            
            for (let i = fusedAIs.length - 1; i >= 0; i--) {
                const fused = fusedAIs[i];
                
                if (currentTime >= fused.endTime) {
                    const newRadius = player.targetRadius - fused.originalRadius * 0.3;
                    player.setRadius(newRadius);
                    
                    leavePopup = {
                        name: fused.name,
                        startTime: millis()
                    };
                    
                    const splitAI = new AIDrop(fused.splitWorldX, fused.splitWorldY, fused.originalRadius);
                    splitAI.hasFusedWithPlayer = true;
                    aiDrops.push(splitAI);
                    
                    for (let j = 0; j < random(3, 5); j++) {
                        const angle = random(TWO_PI);
                        const speed = random(2, 4);
                        const screenX = CANVAS_CENTER_X;
                        const screenY = CANVAS_CENTER_Y;
                        particles.push(new Particle(screenX, screenY, angle, speed));
                    }
                    
                    fusedAIs.splice(i, 1);
                    
                    const prevActivePartners = activePartners;
                    activePartners = fusedAIs.length;
                    
                    if (prevActivePartners >= MAX_FUSIONS && activePartners < MAX_FUSIONS && moveMode === 'mouse') {
                        moveMode = 'key';
                    }
                    
                    let interval = MOVE_INTERVAL - fusedAIs.length * FUSION_INTERVAL_REDUCTION;
                    if (activePartners >= MAX_FUSIONS) {
                        interval -= 200;
                    }
                    playerMoveInterval = max(interval, 500);
                }
            }
        }

            if (elapsed >= PAUSE_DURATION) {

                }

        function findTargetDrop() {
            let candidates = [];
            
            if (moveMode === 'mouse') {
                candidates = drops.slice().sort((a, b) => {
                    const distA = a.distanceTo(player);
                    const distB = b.distanceTo(player);
                    return distA - distB;
                }).slice(0, 5);
                
                if (candidates.length === 0) {
                    return null;
                }
                
                const mouseDirX = mouseX - CANVAS_CENTER_X;
                const mouseDirY = mouseY - CANVAS_CENTER_Y;
                const mouseAngle = atan2(mouseDirY, mouseDirX);
                
                let bestDrop = candidates[0];
                let minAngleDiff = Infinity;
                let minDist = Infinity;
                
                const offsetX = player.worldX - CANVAS_CENTER_X;
                const offsetY = player.worldY - CANVAS_CENTER_Y;
                
                for (let d of candidates) {
                    const screenX = d.worldX - offsetX;
                    const screenY = d.worldY - offsetY;
                    
                    const dropDirX = screenX - CANVAS_CENTER_X;
                    const dropDirY = screenY - CANVAS_CENTER_Y;
                    const dropAngle = atan2(dropDirY, dropDirX);
                    
                    let angleDiff = abs(dropAngle - mouseAngle);
                    if (angleDiff > PI) {
                        angleDiff = TWO_PI - angleDiff;
                    }
                    
                    const dist = d.distanceTo(player);
                    
                    if (angleDiff < minAngleDiff) {
                        minAngleDiff = angleDiff;
                        minDist = dist;
                        bestDrop = d;
                    } else if (abs(angleDiff - minAngleDiff) <= 0.05) {
                        if (dist < minDist) {
                            minDist = dist;
                            bestDrop = d;
                        }
                    }
                }
                
                return bestDrop;
            } else {
                if (nextDir === 'left') {
                    candidates = drops.filter(d => d.worldX < player.worldX && d.worldY > player.worldY);
                } else if (nextDir === 'right') {
                    candidates = drops.filter(d => d.worldX > player.worldX && d.worldY > player.worldY);
                }
                
                if (candidates.length === 0) {
                    candidates = drops.filter(d => d.worldX <= player.worldX && d.worldY >= player.worldY);
                }
                
                if (candidates.length === 0) {
                    return null;
                }
                
                let nearest = candidates[0];
                let minDist = nearest.distanceTo(player);
                
                for (let d of candidates) {
                    const dist = d.distanceTo(player);
                    if (dist < minDist) {
                        minDist = dist;
                        nearest = d;
                    }
                }
                
                return nearest;
            }
        }
        
        function performMove() {
            const target = findTargetDrop();
            
            if (!target) {
                if (moveMode === 'mouse') {
                    noTargetCount++;
                    if (noTargetCount >= 3) {
                        gameOver = true;
                        gameOverTime = millis();
                    }
                    return;
                } else {
                    gameOver = true;
                    gameOverTime = millis();
                    return;
                }
            }
            
            noTargetCount = 0;
            
            const targetScreenPos = target.getScreenPos();
            ripples.push(new Ripple(targetScreenPos.x, targetScreenPos.y));
            
            for (let i = 0; i < random(3, 6); i++) {
                const angle = random(TWO_PI);
                const speed = random(2, 5);
                particles.push(new Particle(targetScreenPos.x, targetScreenPos.y, angle, speed));
            }
            
            if (activePartners >= MAX_FUSIONS) {
                for (let i = 0; i < random(8, 15); i++) {
                    const angle = random(TWO_PI);
                    const speed = random(3, 8);
                    const colorIndex = floor(random(rainbowColors.length));
                    const [r, g, b] = rainbowColors[colorIndex];
                    awakeningParticles.push({
                        x: CANVAS_CENTER_X,
                        y: CANVAS_CENTER_Y,
                        vx: cos(angle) * speed,
                        vy: sin(angle) * speed,
                        color: [r, g, b],
                        size: random(3, 8),
                        life: 1
                    });
                }
                
                if (random() > 0.3) {
                    playBubbleSound();
                }
            }
            
            if (target.hasStar) {
                starCount++;
                starPopup = {
                    worldX: target.worldX,
                    worldY: target.worldY,
                    startTime: millis()
                };
                
                starGlowEffect.active = true;
                starGlowEffect.color = target.starColor || [255, 255, 200];
                starGlowEffect.endTime = millis() + 500;
                
                if (starCount >= STAR_GOAL) {
                    missionComplete = true;
                    missionCompleteTime = millis();
                }
            }
            
            if (target.hasDust) {
                dustEffectEndTime = millis() + DUST_EFFECT_DURATION;
                
                if (!hasSeenDustWarning) {
                    showDustWarning = true;
                    dustWarningEndTime = millis() + 2500;
                    hasSeenDustWarning = true;
                }
            }
            
            player.moveTo(target.worldX, target.worldY);
            player.increaseRadius();
            
            const idx = drops.indexOf(target);
            if (idx > -1) {
                drops.splice(idx, 1);
            }
            
            spawnNewDrop();
            swallowCount++;
            totalSteps++;
            nextDir = null;
            
            if (target.hasStar) {
                playRandomStarSound();
            } else if (target.hasDust) {
                playDustSound();
            } else {
                playRandomEatSound();
            }
        }

        function drawMouseButton(x, y, size, label, isPressed, isDisabled, isLeft) {

                strokeColor = color(200, 200, 200, 60);

            fill(fillColor);
            stroke(strokeColor);

                stroke(100, 100, 100, 60);
                strokeWeight(2);
                line(x - size * 0.35, y - size * 0.35, x + size * 0.35, y + size * 0.35);

        function displayDirectionArrow() {
            if (isMoving || isPaused || manualPaused || gameOver) {
                return;
            }
            
            if (moveMode === 'key' && !nextDir) {
                return;
            }
            
            const target = findTargetDrop();
            if (!target) {
                return;
            }
            
            const playerX = CANVAS_CENTER_X;
            const playerY = CANVAS_CENTER_Y;
            const playerRadius = player.radius;
            
            const targetScreenPos = target.getScreenPos();
            
            push();
            
            const dx = targetScreenPos.x - playerX;
            const dy = targetScreenPos.y - playerY;
            const distance = sqrt(dx * dx + dy * dy);
            const arrowAngle = atan2(dy, dx);
            
            const arrowStartDistance = playerRadius + 15;
            const arrowEndDistance = distance - target.radius - 10;
            
            const pulse = sin(millis() * 0.005) * 0.2 + 0.8;
            const alpha = 150 + pulse * 100;
            
            strokeWeight(2);
            stroke(100, 200, 255, alpha * 0.6);
            noFill();
            line(
                playerX + cos(arrowAngle) * arrowStartDistance,
                playerY + sin(arrowAngle) * arrowStartDistance,
                playerX + cos(arrowAngle) * arrowEndDistance,
                playerY + sin(arrowAngle) * arrowEndDistance
            );
            
            const arrowX = playerX + cos(arrowAngle) * arrowEndDistance;
            const arrowY = playerY + sin(arrowAngle) * arrowEndDistance;
            
            translate(arrowX, arrowY);
            rotate(arrowAngle + PI);
            
            strokeWeight(3);
            stroke(100, 200, 255, alpha);
            fill(100, 200, 255, alpha * 0.5);
            
            const arrowSize = 12 + pulse * 4;
            beginShape();
            vertex(-arrowSize, 0);
            vertex(-arrowSize * 0.3, -arrowSize * 0.4);
            vertex(-arrowSize * 0.3, -arrowSize * 0.2);
            vertex(arrowSize, -arrowSize * 0.2);
            vertex(arrowSize, arrowSize * 0.2);
            vertex(-arrowSize * 0.3, arrowSize * 0.2);
            vertex(-arrowSize * 0.3, arrowSize * 0.4);
            endShape(CLOSE);
            
            pop();
            
            push();
            noFill();
            stroke(100, 200, 255, alpha * 0.4);
            strokeWeight(2);
            ellipse(targetScreenPos.x, targetScreenPos.y, target.radius * 2 + 10, target.radius * 2 + 10);
            pop();
        }

        function drawFusionProgressBar() {
            const barWidth = 120;

            const dropSize = 12;
            const dropX = CANVAS_CENTER_X - barWidth / 2 - dropSize - 8;
            const barX = CANVAS_CENTER_X - barWidth / 2;
            const barY = 38;
            const progress = constrain(fusedAIs.length / MAX_FUSIONS, 0, 1);
            const isAwakened = activePartners >= MAX_FUSIONS;
            
            const glowIntensity = isAwakened ? (0.5 + sin(millis() * 0.005) * 0.3) : 1;
            
            if (isAwakened) {
                drawingContext.shadowBlur = 15;
                drawingContext.shadowColor = 'rgba(255, 200, 100, ' + glowIntensity * 0.8 + ')';
            }
            
            fill(100, 200, 255, 180);
            stroke(150, 230, 255, 180);
            strokeWeight(1);
            beginShape();
            vertex(dropX + dropSize / 2, barY - dropSize / 2);
            bezierVertex(dropX + dropSize / 2, barY + dropSize / 3, 
                        dropX, barY + dropSize / 2, 
                        dropX + dropSize / 2, barY + dropSize / 2);
            bezierVertex(dropX + dropSize, barY + dropSize / 2, 
                        dropX + dropSize / 2, barY + dropSize / 3, 
                        dropX + dropSize / 2, barY - dropSize / 2);
            endShape(CLOSE);
            
            drawingContext.shadowBlur = 0;
            
            fill(60, 60, 60, 180);
            stroke(isAwakened ? color(255, 200, 100, 200) : color(100, 100, 100, 180));
            strokeWeight(2);
            rect(barX, barY, barWidth, barHeight, 6);
            
            if (progress > 0) {
                if (isAwakened) {
                    const rainbowGradient = drawingContext.createLinearGradient(barX, 0, barX + barWidth, 0);
                    rainbowGradient.addColorStop(0, 'rgba(255, 100, 100, ' + (0.9 * glowIntensity) + ')');
                    rainbowGradient.addColorStop(0.2, 'rgba(255, 165, 100, ' + (0.9 * glowIntensity) + ')');
                    rainbowGradient.addColorStop(0.4, 'rgba(255, 255, 100, ' + (0.9 * glowIntensity) + ')');
                    rainbowGradient.addColorStop(0.6, 'rgba(100, 255, 100, ' + (0.9 * glowIntensity) + ')');
                    rainbowGradient.addColorStop(0.8, 'rgba(100, 200, 255, ' + (0.9 * glowIntensity) + ')');
                    rainbowGradient.addColorStop(1, 'rgba(200, 100, 255, ' + (0.9 * glowIntensity) + ')');
                    drawingContext.fillStyle = rainbowGradient;
                    drawingContext.shadowBlur = 10;
                    drawingContext.shadowColor = 'rgba(255, 255, 200, ' + glowIntensity * 0.6 + ')';
                } else {
                    const gradient = drawingContext.createLinearGradient(barX, 0, barX + barWidth, 0);
                    gradient.addColorStop(0, 'rgba(100, 200, 255, 0.9)');
                    gradient.addColorStop(1, 'rgba(150, 230, 255, 0.9)');
                    drawingContext.fillStyle = gradient;

                missionPausedTime += millis() - missionPausedStartTime;

            missionTimeRemaining = max(0, MISSION_TIME_LIMIT - elapsed);

        function displayTrails() {
            const fadeSpeed = gameOver ? 0.04 : 0.02;
            const isAwakened = activePartners >= MAX_FUSIONS;
            
            for (let i = trails.length - 1; i >= 0; i--) {
                const t = trails[i];
                t.life = (t.life || 1.0) - fadeSpeed;
                
                if (t.life <= 0) {
                    trails.splice(i, 1);
                    continue;
                }
                
                const offsetX = player.worldX - CANVAS_CENTER_X;
                const offsetY = player.worldY - CANVAS_CENTER_Y;
                const screenX = t.worldX - offsetX;
                const screenY = t.worldY - offsetY;
                
                const alpha = t.life * 50;
                const width = (t.radius || 12) * 0.5 * t.life;
                
                if (isAwakened) {
                    const colorIndex = (i % rainbowColors.length);
                    const [r, g, b] = rainbowColors[colorIndex];
                    fill(r, g, b, alpha * 0.8);
                    noStroke();
                    ellipse(screenX, screenY, width * 1.5, width * 0.8);
                } else {
                    fill(200, 230, 255, alpha);
                    noStroke();
                    ellipse(screenX, screenY, width, width * 0.6);
                }
                
                if (i < trails.length - 1) {
                    const nextT = trails[i + 1];
                    const nextScreenX = nextT.worldX - offsetX;
                    const nextScreenY = nextT.worldY - offsetY;
                    
                    if (isAwakened) {
                        const nextColorIndex = ((i + 1) % rainbowColors.length);
                        const [r, g, b] = rainbowColors[nextColorIndex];
                        stroke(r, g, b, alpha * 0.5);
                    } else {
                        stroke(200, 230, 255, alpha * 0.5);
                    }
                    strokeWeight(width * 0.3);
                    line(screenX, screenY, nextScreenX, nextScreenY);
                }
            }
            
            while (trails.length > 60) {
                trails.shift();
            }
        }
        
        function updateAwakeningParticles() {
            for (let i = awakeningParticles.length - 1; i >= 0; i--) {
                const p = awakeningParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
                p.life -= 0.02;
                p.size *= 0.98;
                
                if (p.life <= 0 || p.size < 0.5) {
                    awakeningParticles.splice(i, 1);
                }
            }
        }
        
        function displayAwakeningParticles() {
            for (const p of awakeningParticles) {
                const [r, g, b] = p.color;
                
                fill(r, g, b, p.life * 150);
                noStroke();
                ellipse(p.x, p.y, p.size * 2, p.size * 2);
                
                fill(255, 255, 255, p.life * 100);
                ellipse(p.x - p.size * 0.2, p.y - p.size * 0.2, p.size * 0.5, p.size * 0.5);
            }
        }
        
        function createClickParticles(x, y) {
            const goldColors = [
                [255, 215, 0],
                [255, 223, 100],
                [255, 200, 50],
                [255, 180, 0],
                [255, 240, 150]
            ];
            
            for (let i = 0; i < 8; i++) {
                const angle = random(TWO_PI);
                const speed = random(1, 4);
                const colorIndex = floor(random(goldColors.length));
                const [r, g, b] = goldColors[colorIndex];
                
                clickParticles.push({
                    x: x,
                    y: y,
                    vx: cos(angle) * speed,
                    vy: sin(angle) * speed - 1,
                    color: [r, g, b],
                    size: random(2, 5),
                    life: 1,
                    rotation: random(TWO_PI),
                    rotationSpeed: random(-0.2, 0.2)
                });
            }
        }
        
        function updateClickParticles() {
            for (let i = clickParticles.length - 1; i >= 0; i--) {
                const p = clickParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                p.vx *= 0.98;
                p.life -= 0.025;
                p.size *= 0.97;
                p.rotation += p.rotationSpeed;
                
                if (p.life <= 0 || p.size < 0.3) {
                    clickParticles.splice(i, 1);
                }
            }
        }
        
        function displayClickParticles() {
            for (const p of clickParticles) {
                const [r, g, b] = p.color;
                
                push();
                translate(p.x, p.y);
                rotate(p.rotation);
                
                fill(r, g, b, p.life * 200);
                noStroke();
                
                const starSize = p.size * 2;
                beginShape();
                for (let i = 0; i < 5; i++) {
                    const angle = TWO_PI * i / 5 - HALF_PI;
                    const outerX = cos(angle) * starSize;
                    const outerY = sin(angle) * starSize;
                    vertex(outerX, outerY);
                    
                    const innerAngle = angle + TWO_PI / 10;
                    const innerX = cos(innerAngle) * (starSize * 0.4);
                    const innerY = sin(innerAngle) * (starSize * 0.4);
                    vertex(innerX, innerY);
                }
                endShape(CLOSE);
                
                fill(255, 255, 255, p.life * 100);
                ellipse(-starSize * 0.2, -starSize * 0.2, starSize * 0.3, starSize * 0.3);
                
                pop();
            }
        }
        
        function displayAwakeningBorder() {
            if (activePartners < MAX_FUSIONS) return;
            
            const pulse = sin(millis() * 0.003) * 0.5 + 0.5;
            const alpha = 30 + pulse * 50;
            
            noFill();
            
            for (let i = 0; i < rainbowColors.length; i++) {
                const [r, g, b] = rainbowColors[i];
                const offset = i * 3;
                const borderAlpha = alpha * (0.6 + sin(millis() * 0.002 + i * 0.5) * 0.4);
                
                stroke(r, g, b, borderAlpha);
                strokeWeight(2);
                rect(offset, offset, CANVAS_WIDTH - offset * 2, CANVAS_HEIGHT - offset * 2, 10);
            }
        }
        
        function displayStarGlowEffect() {
            if (!starGlowEffect.active) return;
            
            const currentTime = millis();
            const remaining = starGlowEffect.endTime - currentTime;
            
            if (remaining <= 0) {
                starGlowEffect.active = false;
                return;
            }
            
            const progress = 1 - (remaining / 500);
            const pulse = sin(progress * PI) * 0.5 + 0.5;
            
            const [r, g, b] = starGlowEffect.color;
            const maxRadius = player.radius * 4;
            const radius = maxRadius * (0.5 + pulse * 0.5);
            const alpha = (1 - progress) * 150;
            
            push();
            noStroke();
            
            for (let i = 3; i > 0; i--) {
                const glowRadius = radius * (1 + i * 0.4);
                const glowAlpha = alpha * (0.4 / i);
                fill(r, g, b, glowAlpha);
                ellipse(CANVAS_CENTER_X, CANVAS_CENTER_Y, glowRadius * 2, glowRadius * 2);
            }
            
            fill(r, g, b, alpha * 0.8);
            ellipse(CANVAS_CENTER_X, CANVAS_CENTER_Y, radius * 1.5, radius * 1.5);
            
            pop();
        }
        
        function createRainyBackground() {
            bgImage = createImage(CANVAS_WIDTH, CANVAS_HEIGHT);
            bgImage.loadPixels();
            
            for (let y = 0; y < CANVAS_HEIGHT; y++) {
                for (let x = 0; x < CANVAS_WIDTH; x++) {
                    const i = (y * CANVAS_WIDTH + x) * 4;
                    
                    const noiseVal = noise(x * 0.01, y * 0.01);
                    const mistColor = lerpColor(color(40, 60, 80), color(80, 100, 120), noiseVal);
                    
                    const dropProb = noise(x * 0.02, y * 0.02) * 0.3;
                    if (random() < dropProb) {
                        const dropSize = random(1, 4);
                        const alpha = random(50, 150);
                        
                        for (let dy = -dropSize; dy <= dropSize; dy++) {
                            for (let dx = -dropSize; dx <= dropSize; dx++) {
                                const nx = x + dx;
                                const ny = y + dy;
                                if (nx >= 0 && nx < CANVAS_WIDTH && ny >= 0 && ny < CANVAS_HEIGHT) {
                                    const ni = (ny * CANVAS_WIDTH + nx) * 4;
                                    const dist = sqrt(dx * dx + dy * dy);
                                    if (dist <= dropSize) {
                                        const dropAlpha = (1 - dist / dropSize) * alpha;
                                        bgImage.pixels[ni] = min(255, bgImage.pixels[ni] + dropAlpha * 0.8);
                                        bgImage.pixels[ni + 1] = min(255, bgImage.pixels[ni + 1] + dropAlpha * 0.9);
                                        bgImage.pixels[ni + 2] = min(255, bgImage.pixels[ni + 2] + dropAlpha);
                                    }
                                }
                            }
                        }
                    } else {
                        bgImage.pixels[i] = red(mistColor);
                        bgImage.pixels[i + 1] = green(mistColor);
                        bgImage.pixels[i + 2] = blue(mistColor);
                        bgImage.pixels[i + 3] = 255;
                    }
                }
            }
            
            bgImage.updatePixels();
            bgLoaded = true;
        }

        function draw() {
            if (!skipIntro) {
                if (introState === 'preIntro') {
                    if (fifteenthVideoLoaded && fifteenthVideo) {
                        image(fifteenthVideo, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    } else {
                        background(0);
                    }
                    return;
                }
                
                if (introState === 'waiting') {
                    if (startImageLoaded && startImage) {
                        image(startImage, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    } else {
                        background(0);
                    }
                    
                    const alpha = 50 + 50 * sin(millis() / 500);
                    textSize(20);
                    textAlign(CENTER, CENTER);
                    
                    stroke(255, 215, 0, alpha);
                    strokeWeight(2);
                    fill(255, 255, 255, alpha);
                    
                    text('点击任意处开始', CANVAS_CENTER_X, CANVAS_HEIGHT - 80);
                    
                    updateMouseTrail();
                    updateMouseParticles();
                    updateClickParticles();
                    displayMouseTrail();
                    displayMouseParticles();
                    displayClickParticles();
                    return;
                }
                
                if (introState === 'firstMuted' || introState === 'firstUnmuted') {
                    if (introVideoLoaded && introVideo) {
                        image(introVideo, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    } else {
                        background(0);
                    }
                    
                    const alpha = 50 + 50 * sin(millis() / 500);
                    textSize(18);
                    textAlign(CENTER, CENTER);
                    
                    stroke(255, 215, 0, alpha);
                    strokeWeight(1.5);
                    fill(255, 255, 255, alpha);
                    
                    const textY = CANVAS_HEIGHT - 80;
                    if (introState === 'firstMuted') {
                        text('点击任意处唤醒', CANVAS_CENTER_X, textY);
                    } else if (introState === 'firstUnmuted') {
                        text('再试一下吧', CANVAS_CENTER_X, textY);
                    }
                    
                    updateMouseTrail();
                    updateMouseParticles();
                    updateClickParticles();
                    displayMouseTrail();
                    displayMouseParticles();
                    displayClickParticles();
                    return;
                }
                
                if (introState === 'secondPlaying' || introState === 'secondPaused') {
                    if (secondVideoLoaded && secondVideo) {
                        image(secondVideo, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    } else {
                        background(0);
                    }
                    
                    if (introState === 'secondPaused') {
                        const alpha = 50 + 50 * sin(millis() / 500);
                        textSize(18);
                        textAlign(CENTER, CENTER);
                        
                        stroke(255, 215, 0, alpha);
                        strokeWeight(1.5);
                        fill(255, 255, 255, alpha);
                        
                        text('点击任意处', CANVAS_CENTER_X, CANVAS_HEIGHT - 80);
                    }
                    
                    updateMouseTrail();
                    updateMouseParticles();
                    updateClickParticles();
                    displayMouseTrail();
                    displayMouseParticles();
                    displayClickParticles();
                    return;
                }
                
                return;
            }
            
            if (showMissionDialog) {
                if (bgLoaded && bgImage) {
                    image(bgImage, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                } else {
                    background(0);
                }
                displayMissionDialog();
                updateMouseTrail();
                updateMouseParticles();
                updateClickParticles();
                displayMouseTrail();
                displayMouseParticles();
                displayClickParticles();
                return;
            }
            
            if (showOperationGuide) {

                    image(bgImage, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                }
                displayOperationGuide();
                updateMouseTrail();
                updateMouseParticles();
                updateClickParticles();
                displayMouseTrail();
                displayMouseParticles();
                displayClickParticles();
                return;
            }
            
            if (gamePhase === 'thirdVideo' || gamePhase === 'thirdPaused') {
                if (thirdVideoLoaded && thirdVideo) {
                    image(thirdVideo, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                } else {
                    background(0);
                }
                
                if (gamePhase === 'thirdPaused') {
                    const alpha = 50 + 50 * sin(millis() / 500);
                    textSize(18);
                    textAlign(CENTER, CENTER);
                    
                    fill(0, 0, 0, alpha);
                    
                    text('点击查看旅行记录', CANVAS_CENTER_X, CANVAS_HEIGHT - 80);
                }
                
                updateMouseTrail();
                updateMouseParticles();
                updateClickParticles();
                displayMouseTrail();
                displayMouseParticles();
                displayClickParticles();
                return;
            }
            
            if (gamePhase === 'journal') {
                displayJourneyRecordPage();
                updateMouseTrail();
                updateMouseParticles();
                updateClickParticles();
                displayMouseTrail();
                displayMouseParticles();
                displayClickParticles();
                return;
            }
            
            if (bgLoaded && bgImage) {
                image(bgImage, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            } else {
                background(0);
            }
            
            displayAwakeningBorder();
            
            if (gameOver) {
                for (let d of drops) {
                    d.display();
                }
                for (let ai of aiDrops) {
                    ai.display();
                }
                
                const fadeSpeed = 0.003;
                for (let d of drops) {
                    d.opacity = max(0, d.opacity - fadeSpeed * 255);
                }
                
                for (let ai of aiDrops) {
                    ai.radius = max(0, ai.radius - fadeSpeed * 2);
                }
                
                const playerAlpha = max(0, 220 - (millis() - gameOverTime) * fadeSpeed * 255);
                fill(255, 215, 100, playerAlpha);
                stroke(255, 230, 150, playerAlpha * 0.9);
                strokeWeight(1);
                ellipse(CANVAS_CENTER_X, CANVAS_CENTER_Y, player.radius * 2, player.radius * 2);
                
                return;
            }
            
            if (missionComplete) {
                for (let d of drops) {
                    d.display();
                }
                for (let ai of aiDrops) {
                    ai.display();
                }
                player.display();
                displayMissionComplete();
                return;
            }
            
            if (missionFailed) {
                for (let d of drops) {
                    d.display();
                }
                for (let ai of aiDrops) {
                    ai.display();
                }
                player.display();
                displayMissionFailed();
                return;
            }

        function mouseMoved() {
            const dx = mouseX - lastMouseX;
            const dy = mouseY - lastMouseY;
            const distance = sqrt(dx * dx + dy * dy);
            
            if (distance > 2) {
                isMouseMoved = true;
                mouseTrail.push({ x: mouseX, y: mouseY, time: millis() });
                
                if (mouseTrail.length > 10) {
                    mouseTrail.shift();
                }
                
                mouseFrameCount++;
                if (mouseFrameCount % 2 === 0) {
                    createMouseParticles(mouseX, mouseY);
                }
            }
            
            lastMouseX = mouseX;
            lastMouseY = mouseY;
        }
        
        function createMouseParticles(x, y) {
            const count = random() > 0.5 ? 2 : 1;
            
            for (let i = 0; i < count; i++) {
                const angle = random(TWO_PI);
                const speed = random(0.3, 1.0);
                const isGold = random() > 0.7;
                
                mouseParticles.push({
                    x: x,
                    y: y,
                    vx: cos(angle) * speed,
                    vy: sin(angle) * speed,
                    size: random(1, 3),
                    color: isGold ? [255, 215, 100] : [200, 230, 255],
                    life: random(15, 25),
                    maxLife: random(15, 25)
                });
            }
            
            if (mouseParticles.length > 60) {
                mouseParticles.splice(0, mouseParticles.length - 60);
            }
        }
        
        function updateMouseTrail() {
            const maxAge = 500;
            const currentTime = millis();
            
            mouseTrail = mouseTrail.filter(p => currentTime - p.time < maxAge);
        }
        
        function updateMouseParticles() {
            for (let i = mouseParticles.length - 1; i >= 0; i--) {
                const p = mouseParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.98;
                p.vy *= 0.98;
                p.life--;
                
                if (p.life <= 0) {
                    mouseParticles.splice(i, 1);
                }
            }
        }
        
        function displayMouseTrail() {
            if (mouseTrail.length < 2) return;
            
            for (let i = 1; i < mouseTrail.length; i++) {
                const alpha = (i / mouseTrail.length) * 20;
                const width = (i / mouseTrail.length) * 1.5;
                
                stroke(200, 230, 255, alpha);
                strokeWeight(width);
                line(mouseTrail[i - 1].x, mouseTrail[i - 1].y, mouseTrail[i].x, mouseTrail[i].y);
            }
            
            noStroke();
        }
        
        function displayMouseParticles() {
            for (const p of mouseParticles) {

                const [r, g, b] = p.color;
                
                fill(r, g, b, alpha);
                noStroke();
                ellipse(p.x, p.y, p.size, p.size);
            }

        function playBubbleSound() {
            if (!soundEnabled) return;
            
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                const baseFreq = random(500, 800);
                oscillator.frequency.setValueAtTime(baseFreq, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(baseFreq * 1.3, audioContext.currentTime + 0.08);
                oscillator.frequency.exponentialRampToValueAtTime(baseFreq * 0.9, audioContext.currentTime + 0.2);
                
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.08, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
                
                if (random() > 0.7) {
                    const osc2 = audioContext.createOscillator();
                    const gain2 = audioContext.createGain();
                    
                    const freq2 = random(600, 900);
                    osc2.frequency.setValueAtTime(freq2, audioContext.currentTime);
                    osc2.frequency.exponentialRampToValueAtTime(freq2 * 1.15, audioContext.currentTime + 0.05);
                    
                    osc2.type = 'sine';
                    
                    gain2.gain.setValueAtTime(0.05, audioContext.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.12);
                    
                    osc2.connect(gain2);
                    gain2.connect(audioContext.destination);
                    
                    osc2.start(audioContext.currentTime);
                    osc2.stop(audioContext.currentTime + 0.12);
                }
            } catch (e) {
                console.log('Audio not supported');
            }
        }
